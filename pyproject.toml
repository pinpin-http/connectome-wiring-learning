[project]
name = "flymario"
version = "0.1.0"
description = "Does Drosophila connectome topology help an agent learn Super Mario Bros? A controlled topology ablation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }  # code; results and manuscript: CC BY 4.0 (LICENSE-CC-BY-4.0.txt)
authors = [{ name = "Soheib Bouazzaoui" }]

dependencies = [
  # --- numerics / sparse graph core ---
  "numpy>=1.26,<2.2",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15.0",          # .feather connectome weights
  "polars>=1.0",            # fast out-of-core scans on the 1.1 GB table
  "networkx>=3.2",          # null-model rewiring, graph stats
  # --- environment ---
  "gymnasium>=0.29,<1.1",
  "stable-retro>=0.9.3",
  "opencv-python-headless>=4.9",
  # --- learning ---
  "scikit-learn>=1.4",
  "torch>=2.4",
  "stable-baselines3>=2.3",
  "tensorboard>=2.16",
  # --- data / config / logging ---
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "rich>=13.7",
  "typer>=0.12",
  # --- dataset access ---
  "requests>=2.31",
  # --- viz ---
  "pygame>=2.5",            # the live telemetry dashboard
  "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["torch"]        # install from the ROCm index: scripts/install_gpu.sh
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5", "mypy", "ipykernel", "jupyterlab"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flymario"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests are opt-in: `pytest -m slow` runs them, `make test` does not.
# The determinism check rebuilds both connectomes from the raw feathers twice,
# which is minutes, and §42 puts it in the pre-freeze run rather than every
# commit.
addopts = '-q -m "not slow"'
markers = ["slow: rebuilds from raw tables or loads the full connectome"]
