# EXPERIENCE_COMMUNE_V1 configuration (docs/experience_commune/MISSION.md §18). The main launcher refuses a draft.
experiment_id: EXPERIENCE_COMMUNE_V1
protocol_status: frozen                 # docs/experience_commune/PROTOCOL_FROZEN.md
frozen_protocol_sha256: null          # recorded in RUN_LOG.md at the freeze
repository_commit: null

communication:
  scientific_report: final_only
  interim_comparative_results: false
  use_current_v2_results_for_decisions: false

budget:
  t0_utc: "2026-10-20T11:32:26Z"
  hard_end_utc: "2026-10-21T11:32:26Z"         # 24 h
  main_campaign_must_end_utc: "2026-10-21T07:32:26Z"   # H20
  main_campaign_hours_max: 15
  benchmark_safety_factor: 1.25

design:
  selected_plan: P1                   # PILOT.md: 41 x 17.2 min x 1.25 = 14.7 h <= 15 h
  include_ood: true
  projected_graph_wall_s: 1290        # 1,032 s measured x 1.25, the per-graph deadline guard
  workers: 1                          # concurrency gives no throughput on this GPU (PILOT.md)
  graph_manifest: artifacts/experience_commune_v1/manifests/graph_selection.json
  block_manifest: artifacts/experience_commune_v1/manifests/data.json
  blocks_P1_P2: [b0, b1, b2, b3, b4, b5]
  blocks_P3: [b0, b1, b2]
  development_block: d0
  development_graphs: ["nulllat:100", "nullin:100"]
  tasks: [where, loom]                # "Où ?" (T-field) and "Approche ou recul ?" (T-loom), Study S A1 stimuli
  modes: [N, U]
  training_decisions: 6000

policy:
  actions: 8
  temperature: 2.0
  epsilon_uniform_mixture: 0.1
  U_behavior: independent_uniform_with_replacement
  U_behavior_probability: 0.125
  importance_correction: target_probability_over_behavior_probability
  importance_clipping: false
  importance_self_normalization: false
  score_function: exact_mixture        # (1 - eps) u_a / pi_a (onehot - u) in BOTH modes (AUDIT.md item 7)
  historical_signal_kept_as_reference_only: true

learning:
  original_config: scripts/diagnostics/study_s.py (eta 0.001, kappa 0.2, ebar 0.05, RMS 0.95, baseline rate 0.1)
  eta: 0.001
  baseline_definition: per stimulus class running mean of reward, rate 0.1, read before its update (uses the class)
  baseline_read_before_current_reward_update: true
  plasticity_enabled: true
  plastic_edges: all connections onto the 2,227 readout neurons, sign fixed, magnitude in [0, 2 m0]
  global_gain_changed: false
  per_graph_temperature_tuning: false
  importance_applied_before_rms: true

evaluation:
  checkpoints: [0, 250, 500, 1000, 2000, 4000, 6000]
  progress_images_per_task_block: 512
  final_iid_images_per_task_block: 2048
  optional_ood_images_per_task_block: 512
  action_selection: greedy
  update_training_state: false
  noise: keyed per (block evaluation seed, image uid), independent of training
  score_comparisons_only_after_campaign_complete: true

analysis:
  primary_metric: normalized_trapezoidal_greedy_learning_auc
  secondary_acquisition_metrics: [initial_accuracy, final_minus_initial, auc_minus_initial, final_iid_accuracy]
  descriptive: [E1_reward_rate_N, U_journal_reward_rate, ood_accuracy]
  primary_contrasts: G_U_by_task_and_null_family
  primary_family_size: 4
  family_error_rate: 0.05
  primary_interval_confidence: 0.9875
  secondary_interval_confidence: 0.95
  practical_margin: 0.03
  informative_final_accuracy_threshold: 0.25
  bootstrap_replicates: 10000
  bootstrap_seed: 20261021
  resample_training_blocks: true
  resample_null_graphs_within_family: true
  resample_test_examples_stratified_paired: true
  biological_connectomes: 1
